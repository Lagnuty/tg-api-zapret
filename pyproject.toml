[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tg-api-zapret"
version = "0.4.29"
description = "Async Telegram MTProto wrapper with reusable session storage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tg-api-zapret maintainers" }]
dependencies = [
  "Telethon>=1.36,<2.0",
  "PySocks>=1.7,<2.0",
  "python-socks[asyncio]>=2.4,<3.0",
  "fastapi>=0.115,<1.0",
  "redis>=5.0,<6.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[project.scripts]
tg-api-zapret = "tg_api_zapret.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tg_api_zapret"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
